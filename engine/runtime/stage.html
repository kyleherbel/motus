<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motus stage</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  /* The stage is always 1080x1920 CSS px. Preview scales it to the frame it sits in. */
  #fit { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%; transform: translate(-50%, -50%); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; contain: strict; }
  body.render #fit { left: 0; top: 0; transform: none; }
  #src { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #err { position: absolute; inset: 0; display: none; padding: 60px; font: 500 34px/1.35 ui-monospace, Menlo, monospace; color: #ff8a8a; background: #1a0f0f; white-space: pre-wrap; z-index: 99; }
</style>
</head>
<body>
<div id="fit"><div id="stage"></div><div id="err"></div></div>
<script type="module" src="stage.js"></script>
</body>
</html>
