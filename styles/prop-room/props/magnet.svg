<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" data-shadow="rest">
  <!-- Prop Room library prop: a horseshoe magnet pulling things up to it (props/STANDARD.md). Red lacquer lit
       from the top, chrome pole tips [C24].
       Parts:
         field     curved field lines between the poles; data-drawn 0                (draw)
         magnet    body and pole tips; body has data-base                            (recolor, pulse; move dy -40)
         item1..item3  things under the magnet                                       (move dy -220 ease out pulls one up;
                   badge on one) -->
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.14"/></linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DA3AA"/><stop offset="0.3" stop-color="#F7F8FA"/><stop offset="0.6" stop-color="#D6DAE0"/><stop offset="1" stop-color="#8F959B"/></linearGradient>
    <radialGradient id="coin" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#FFF1C2"/><stop offset="0.5" stop-color="#F2C24E"/><stop offset="1" stop-color="#C08A22"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9ECF0"/></linearGradient>
  </defs>

  <g id="field" data-drawn="0" fill="none" stroke="#357CEF" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round">
    <path d="M230 740 C230 860 770 860 770 740"/>
    <path d="M200 760 C180 950 820 950 800 760"/>
  </g>

  <g id="magnet">
    <path d="M110 560 V450 C110 235 285 60 500 60 C715 60 890 235 890 450 V560 H670 V450 C670 356 594 280 500 280 C406 280 330 356 330 450 V560 Z" fill="#E5484D" data-base=""/>
    <path d="M110 560 V450 C110 235 285 60 500 60 C715 60 890 235 890 450 V560 H670 V450 C670 356 594 280 500 280 C406 280 330 356 330 450 V560 Z" fill="url(#light)"/>
    <path d="M110 560 V450 C110 235 285 60 500 60 C715 60 890 235 890 450 V560 H670 V450 C670 356 594 280 500 280 C406 280 330 356 330 450 V560 Z" fill="url(#side)"/>
    <path d="M190 330 C240 190 360 110 500 100" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="16" stroke-linecap="round"/>
    <rect x="110" y="552" width="220" height="150" rx="10" fill="url(#tip)"/>
    <rect x="670" y="552" width="220" height="150" rx="10" fill="url(#tip)"/>
    <rect x="110" y="552" width="220" height="14" fill="#000" opacity="0.15"/>
    <rect x="670" y="552" width="220" height="14" fill="#000" opacity="0.15"/>
    <rect x="118" y="690" width="204" height="10" rx="5" fill="#000" opacity="0.12"/>
    <rect x="678" y="690" width="204" height="10" rx="5" fill="#000" opacity="0.12"/>
  </g>

  <g id="item1"><circle cx="250" cy="900" r="64" fill="url(#coin)"/><circle cx="250" cy="900" r="44" fill="none" stroke="#B9831F" stroke-opacity="0.5" stroke-width="6"/><ellipse cx="228" cy="872" rx="18" ry="10" fill="#FFFFFF" opacity="0.6"/></g>
  <g id="item2"><g transform="rotate(-8 500 910)"><rect x="420" y="860" width="160" height="104" rx="18" fill="url(#card)"/><rect x="440" y="884" width="70" height="16" rx="8" fill="#357CEF"/><rect x="440" y="914" width="110" height="10" rx="5" fill="#D8DADF"/></g></g>
  <g id="item3"><circle cx="750" cy="900" r="64" fill="url(#coin)"/><circle cx="750" cy="900" r="44" fill="none" stroke="#B9831F" stroke-opacity="0.5" stroke-width="6"/><ellipse cx="728" cy="872" rx="18" ry="10" fill="#FFFFFF" opacity="0.6"/></g>
</svg>
