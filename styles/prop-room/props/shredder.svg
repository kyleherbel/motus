<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" data-shadow="rest">
  <!-- Prop Room library prop: a paper shredder with a page waiting above the slot (props/STANDARD.md). Matte black
       head lit from the top, a frosted bin that shows the strips through it.
       Parts:
         page      the sheet above the slot, clipped so it vanishes into it        (move dy 540 ease slow feeds it in;
                   badge cross on it first)
         head      the cutter head with its slot, static
         led       status light on the head; data-base                              (recolor, pulse)
         strips    cut strips in the bin, start hidden, clipped under the head      (show slide from up dist 220)
         bin       the frosted bin front, static -->
  <defs>
    <linearGradient id="headG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D4148"/><stop offset="1" stop-color="#16181B"/></linearGradient>
    <linearGradient id="slotG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#26292E"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0F3"/></linearGradient>
    <linearGradient id="binG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8FA" stop-opacity="0.80"/><stop offset="1" stop-color="#DDE1E6" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="binBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9CED4"/><stop offset="1" stop-color="#E3E6EA"/></linearGradient>
    <radialGradient id="ledGlow"><stop offset="0.4" stop-color="#F0574A" stop-opacity="0.55"/><stop offset="1" stop-color="#F0574A" stop-opacity="0"/></radialGradient>
    <clipPath id="above"><rect x="-200" y="-1000" width="1400" height="1470"/></clipPath>
    <clipPath id="below"><rect x="100" y="600" width="800" height="480" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#above)">
    <g id="page">
      <rect x="230" y="20" width="540" height="430" rx="12" fill="url(#paper)"/>
      <rect x="240" y="24" width="520" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="280" y="70" width="240" height="26" rx="13" fill="#357CEF"/>
      <rect x="280" y="124" width="420" height="14" rx="7" fill="#D8DADF"/><rect x="280" y="156" width="380" height="14" rx="7" fill="#D8DADF"/>
      <rect x="280" y="188" width="400" height="14" rx="7" fill="#E3E5E9"/><rect x="280" y="220" width="300" height="14" rx="7" fill="#E3E5E9"/>
      <rect x="280" y="270" width="440" height="130" rx="14" fill="#EEF1F5"/>
    </g>
  </g>

  <rect x="100" y="600" width="800" height="480" rx="30" fill="url(#binBack)"/>
  <g clip-path="url(#below)">
    <g id="strips" visibility="hidden" fill="#FFFFFF">
      <rect x="250" y="590" width="26" height="250" rx="4"/><rect x="292" y="590" width="26" height="230" rx="4"/><rect x="334" y="590" width="26" height="262" rx="4"/>
      <rect x="376" y="590" width="26" height="240" rx="4"/><rect x="418" y="590" width="26" height="256" rx="4"/><rect x="460" y="590" width="26" height="226" rx="4"/>
      <rect x="502" y="590" width="26" height="250" rx="4"/><rect x="544" y="590" width="26" height="268" rx="4"/><rect x="586" y="590" width="26" height="236" rx="4"/>
      <rect x="628" y="590" width="26" height="252" rx="4"/><rect x="670" y="590" width="26" height="232" rx="4"/><rect x="712" y="590" width="26" height="248" rx="4"/>
      <rect x="292" y="700" width="26" height="40" fill="#357CEF"/><rect x="334" y="700" width="26" height="40" fill="#357CEF"/><rect x="376" y="700" width="26" height="40" fill="#357CEF"/>
    </g>
  </g>
  <g id="bin">
    <rect x="100" y="600" width="800" height="480" rx="30" fill="url(#binG)"/>
    <rect x="100" y="600" width="800" height="480" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5"/>
    <rect x="130" y="1030" width="740" height="10" rx="5" fill="#000" opacity="0.06"/>
  </g>

  <g id="head">
    <rect x="40" y="430" width="920" height="200" rx="56" fill="url(#headG)"/>
    <rect x="90" y="436" width="820" height="5" rx="2.5" fill="#FFFFFF" opacity="0.3"/>
    <rect x="110" y="458" width="780" height="30" rx="15" fill="url(#slotG)"/>
    <rect x="120" y="488" width="760" height="3" rx="1.5" fill="#FFFFFF" opacity="0.2"/>
    <rect x="40" y="600" width="920" height="30" rx="15" fill="#000" opacity="0.25"/>
  </g>
  <g id="led">
    <circle cx="870" cy="550" r="44" fill="url(#ledGlow)"/>
    <circle cx="870" cy="550" r="17" fill="#F0574A" data-base=""/>
    <circle cx="865" cy="544" r="6" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
