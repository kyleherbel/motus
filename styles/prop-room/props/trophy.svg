<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" data-shadow="rest">
  <!-- Prop Room library prop: a gold trophy cup on a plinth (props/STANDARD.md). Polished gold lit from the top
       left with a hard highlight band, a dark plinth with a plate.
       Parts:
         cup       bowl, handles and stem, static                                    (pulse)
         shine     a light band clipped to the bowl, waits left of it               (move dx 760 ease inOut sweeps it)
         base      the plinth, static
         plate     the plate on the plinth; data-base                               (recolor, pulse)
         spark1..spark3  sparkles around the cup, start hidden                     (show grow, staggered) -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C08A22"/><stop offset="0.18" stop-color="#F7D879"/><stop offset="0.3" stop-color="#FFF1C2"/>
      <stop offset="0.45" stop-color="#F2C24E"/><stop offset="0.8" stop-color="#D9A231"/><stop offset="1" stop-color="#A9761C"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#7A4E0E" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9761C"/><stop offset="1" stop-color="#E0AE3E"/></linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4047"/><stop offset="1" stop-color="#1B1D21"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="bowl"><path d="M230 110 H770 V330 C770 520 655 640 500 650 C345 640 230 520 230 330 Z"/></clipPath>
  </defs>

  <g id="cup">
    <path d="M238 190 C110 190 70 260 84 340 C100 430 180 480 262 490" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linecap="round"/>
    <path d="M762 190 C890 190 930 260 916 340 C900 430 820 480 738 490" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linecap="round"/>
    <path d="M440 640 H560 L548 760 H452 Z" fill="url(#gold)"/>
    <ellipse cx="500" cy="700" rx="80" ry="22" fill="url(#gold)"/>
    <path d="M380 800 C380 770 420 752 500 752 C580 752 620 770 620 800 Z" fill="url(#gold)"/>
    <path d="M230 110 H770 V330 C770 520 655 640 500 650 C345 640 230 520 230 330 Z" fill="url(#gold)"/>
    <path d="M230 110 H770 V330 C770 520 655 640 500 650 C345 640 230 520 230 330 Z" fill="url(#goldV)"/>
    <ellipse cx="500" cy="110" rx="270" ry="34" fill="url(#gold)"/>
    <ellipse cx="500" cy="112" rx="240" ry="22" fill="url(#inner)"/>
    <path d="M500 250 L528 312 L596 318 L545 362 L560 430 L500 395 L440 430 L455 362 L404 318 L472 312 Z" fill="#000" opacity="0.10" transform="translate(4 6)"/>
    <path d="M500 250 L528 312 L596 318 L545 362 L560 430 L500 395 L440 430 L455 362 L404 318 L472 312 Z" fill="#FFE7A0"/>
    <path d="M300 180 C300 330 330 450 400 540" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="22" stroke-linecap="round"/>
  </g>

  <g clip-path="url(#bowl)">
    <g id="shine"><path d="M60 60 H160 L-20 700 H-120 Z" fill="url(#band)"/></g>
  </g>

  <g id="base">
    <rect x="290" y="796" width="420" height="250" rx="26" fill="url(#plinth)"/>
    <rect x="310" y="800" width="380" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
    <rect x="270" y="1010" width="460" height="44" rx="16" fill="url(#plinth)"/>
  </g>
  <g id="plate">
    <rect x="370" y="870" width="260" height="100" rx="12" fill="url(#gold)" data-base=""/>
    <rect x="370" y="870" width="260" height="100" rx="12" fill="url(#goldV)"/>
    <rect x="410" y="908" width="180" height="16" rx="8" fill="#7A4E0E" opacity="0.35"/>
  </g>

  <g id="spark1" visibility="hidden"><path d="M150 60 Q160 110 210 120 Q160 130 150 180 Q140 130 90 120 Q140 110 150 60 Z" fill="#FFFFFF"/><path d="M150 60 Q160 110 210 120 Q160 130 150 180 Q140 130 90 120 Q140 110 150 60 Z" fill="#F2C24E" opacity="0.35"/></g>
  <g id="spark2" visibility="hidden"><path d="M880 20 Q888 62 930 70 Q888 78 880 120 Q872 78 830 70 Q872 62 880 20 Z" fill="#FFFFFF"/><path d="M880 20 Q888 62 930 70 Q888 78 880 120 Q872 78 830 70 Q872 62 880 20 Z" fill="#F2C24E" opacity="0.35"/></g>
  <g id="spark3" visibility="hidden"><path d="M860 560 Q866 596 902 602 Q866 608 860 644 Q854 608 818 602 Q854 596 860 560 Z" fill="#FFFFFF"/><path d="M860 560 Q866 596 902 602 Q866 608 860 644 Q854 608 818 602 Q854 596 860 560 Z" fill="#F2C24E" opacity="0.35"/></g>
</svg>
