<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" data-shadow="rest">
  <!-- Prop Room library prop: an open laptop seen from the front (props/STANDARD.md). Graphite lid, silver deck
       lit from the top; the screen shows generic interface blocks, never a real product.
       Parts:
         lid       bezel and camera, static
         screenA   the first screen state                                            (swap to screenB)
         screenB   the second screen state, start hidden: a chart that has gone up   (swap target)
         bar       the chart bar inside screenB; data-base                           (fill to 1 grows it; recolor)
         cursor    a pointer on the screen                                           (move dx dy ease inOut; pulse)
         deck      the base, static -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3E44"/><stop offset="1" stop-color="#1A1C20"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8FA"/><stop offset="1" stop-color="#E8EBEF"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F3F5"/><stop offset="1" stop-color="#B9BEC5"/></linearGradient>
    <linearGradient id="deckFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9CED4"/><stop offset="1" stop-color="#9DA3AA"/></linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="disp"><rect x="140" y="52" width="720" height="460" rx="10"/></clipPath>
  </defs>

  <g id="lid">
    <rect x="110" y="20" width="780" height="540" rx="32" fill="url(#bezel)"/>
    <rect x="140" y="24" width="720" height="4" rx="2" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="500" cy="37" r="6" fill="#4D525A"/>
  </g>

  <g clip-path="url(#disp)">
    <g id="screenA">
      <rect x="140" y="52" width="720" height="460" fill="url(#screen)"/>
      <rect x="140" y="52" width="720" height="44" fill="#FFFFFF"/>
      <circle cx="170" cy="74" r="7" fill="#FF5F57"/><circle cx="192" cy="74" r="7" fill="#FEBC2E"/><circle cx="214" cy="74" r="7" fill="#28C840"/>
      <rect x="140" y="96" width="150" height="416" fill="#EEF0F3"/>
      <rect x="162" y="122" width="100" height="14" rx="7" fill="#C9CED4"/><rect x="162" y="150" width="80" height="14" rx="7" fill="#D8DCE1"/><rect x="162" y="178" width="90" height="14" rx="7" fill="#D8DCE1"/>
      <rect x="318" y="122" width="250" height="160" rx="16" fill="#FFFFFF"/><rect x="590" y="122" width="244" height="160" rx="16" fill="#FFFFFF"/>
      <rect x="340" y="146" width="120" height="16" rx="8" fill="#357CEF"/><rect x="340" y="178" width="200" height="12" rx="6" fill="#D8DADF"/><rect x="340" y="202" width="170" height="12" rx="6" fill="#E3E5E9"/>
      <rect x="612" y="146" width="100" height="16" rx="8" fill="#ECAB44"/><rect x="612" y="178" width="190" height="12" rx="6" fill="#D8DADF"/><rect x="612" y="202" width="150" height="12" rx="6" fill="#E3E5E9"/>
      <rect x="318" y="304" width="516" height="180" rx="16" fill="#FFFFFF"/>
      <rect x="340" y="328" width="200" height="16" rx="8" fill="#C9CED4"/><rect x="340" y="364" width="460" height="12" rx="6" fill="#E3E5E9"/><rect x="340" y="388" width="420" height="12" rx="6" fill="#E3E5E9"/><rect x="340" y="412" width="440" height="12" rx="6" fill="#E3E5E9"/>
    </g>
    <g id="screenB" visibility="hidden">
      <rect x="140" y="52" width="720" height="460" fill="url(#screen)"/>
      <rect x="140" y="52" width="720" height="44" fill="#FFFFFF"/>
      <circle cx="170" cy="74" r="7" fill="#FF5F57"/><circle cx="192" cy="74" r="7" fill="#FEBC2E"/><circle cx="214" cy="74" r="7" fill="#28C840"/>
      <rect x="180" y="122" width="640" height="360" rx="18" fill="#FFFFFF"/>
      <rect x="210" y="148" width="180" height="18" rx="9" fill="#C9CED4"/>
      <rect x="240" y="380" width="70" height="72" rx="10" fill="#C9D6EA"/><rect x="340" y="340" width="70" height="112" rx="10" fill="#C9D6EA"/>
      <rect x="440" y="300" width="70" height="152" rx="10" fill="#C9D6EA"/><rect x="540" y="250" width="70" height="202" rx="10" fill="#C9D6EA"/>
      <g id="bar"><rect x="640" y="186" width="70" height="266" rx="10" fill="#357CEF" data-base=""/><rect x="646" y="190" width="58" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/></g>
    </g>
    <rect x="140" y="52" width="720" height="460" fill="url(#glare)"/>
  </g>

  <g id="cursor">
    <path d="M600 330 L600 400 L616 386 L628 414 L642 408 L630 380 L652 380 Z" fill="#1C1E22" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <g id="deck">
    <path d="M24 604 L112 560 H888 L976 604 Z" fill="url(#deck)"/>
    <path d="M24 604 H976 V626 C976 646 960 660 940 660 H60 C40 660 24 646 24 626 Z" fill="url(#deckFront)"/>
    <path d="M24 604 H976" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>
    <path d="M420 604 H580 C580 618 570 624 556 624 H444 C430 624 420 618 420 604 Z" fill="#000" opacity="0.12"/>
    <rect x="112" y="556" width="776" height="8" rx="4" fill="#000" opacity="0.25"/>
  </g>
</svg>
