<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" data-shadow="rest">
  <!-- Prop Room library prop: an iceberg in a block of sea, the small tip above the surface and the large body
       below (props/STANDARD.md). Ice is faceted, each facet lit from the top; under water it turns bluer.
       Parts:
         water     the sea block with its surface; data-fill="slide" data-level 1 inside the block clip
                   (fill to 0.25 lowers the sea and shows the body; pulse)
         body      the part under water, static                                   (pulse)
         tip       the part above water, static                                    (pulse; move dy -40)
         item1..item3  chips on the hidden body, start hidden                     (show grow, one per beat; badge) -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C9BE3"/><stop offset="1" stop-color="#0E3E7E"/></linearGradient>
    <linearGradient id="seaSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/></linearGradient>
    <linearGradient id="iceA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEFFB"/></linearGradient>
    <linearGradient id="iceB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F3FD"/><stop offset="1" stop-color="#B9DEF5"/></linearGradient>
    <linearGradient id="iceC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E7FA"/><stop offset="1" stop-color="#93C7EC"/></linearGradient>
    <linearGradient id="deepA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3F8"/><stop offset="1" stop-color="#7DB6E4"/></linearGradient>
    <linearGradient id="deepB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD0F2"/><stop offset="1" stop-color="#5E9BD6"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1F5"/></linearGradient>
    <clipPath id="block"><rect x="20" y="300" width="960" height="880" rx="72"/></clipPath>
  </defs>

  <g clip-path="url(#block)">
    <g id="water" data-fill="slide" data-level="1" data-ring="#3C9BE3">
      <rect x="20" y="318" width="960" height="862" fill="url(#sea)"/>
      <rect x="20" y="318" width="960" height="862" fill="url(#seaSide)"/>
      <path d="M20 330 C120 312 220 312 320 328 C420 344 520 344 620 328 C720 312 820 312 980 330 V350 C820 334 720 334 620 350 C520 366 420 366 320 350 C220 334 120 334 20 352 Z" fill="#FFFFFF" opacity="0.55"/>
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round">
        <path d="M70 520 C150 505 210 530 290 515"/><path d="M720 600 C800 585 860 610 930 595"/><path d="M90 900 C170 885 230 910 310 895"/><path d="M700 1020 C780 1005 840 1030 920 1015"/>
      </g>
    </g>
  </g>

  <g id="body" data-ring="#3C9BE3">
    <path d="M300 330 L700 330 L812 470 L860 720 L790 960 L620 1120 L410 1130 L220 990 L140 740 L190 470 Z" fill="url(#deepB)"/>
    <path d="M300 330 L700 330 L760 470 L500 520 L240 470 Z" fill="url(#iceC)"/>
    <path d="M240 470 L500 520 L460 760 L190 740 L140 740 L190 470 Z" fill="url(#deepA)"/>
    <path d="M500 520 L760 470 L812 470 L860 720 L640 780 Z" fill="url(#deepA)" opacity="0.75"/>
    <path d="M190 740 L460 760 L520 990 L220 990 Z" fill="url(#deepB)" opacity="0.8"/>
    <path d="M640 780 L860 720 L790 960 L520 990 L460 760 Z" fill="#5E9BD6" opacity="0.55"/>
    <path d="M220 990 L520 990 L620 1120 L410 1130 Z" fill="#4C88C8" opacity="0.6"/>
    <path d="M300 330 L700 330" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4"/>
  </g>

  <g id="tip" data-ring="#3C9BE3">
    <path d="M300 334 L410 150 L520 40 L610 170 L700 334 Z" fill="url(#iceB)"/>
    <path d="M410 150 L520 40 L540 210 L450 334 L300 334 Z" fill="url(#iceA)"/>
    <path d="M520 40 L610 170 L700 334 L560 334 L540 210 Z" fill="url(#iceC)" opacity="0.8"/>
    <path d="M520 40 L410 150" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M300 334 C420 324 580 324 700 334" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <g id="item1" visibility="hidden">
    <rect x="430" y="470" width="140" height="140" rx="34" fill="url(#chip)"/>
    <rect x="440" y="474" width="120" height="4" rx="2" fill="#FFFFFF"/>
    <circle cx="500" cy="528" r="30" fill="#ECAB44"/><rect x="486" y="560" width="28" height="22" rx="6" fill="#9AA0A7"/>
  </g>
  <g id="item2" visibility="hidden">
    <rect x="430" y="680" width="140" height="140" rx="34" fill="url(#chip)"/>
    <rect x="440" y="684" width="120" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="462" y="760" width="20" height="36" rx="6" fill="#357CEF"/><rect x="490" y="736" width="20" height="60" rx="6" fill="#357CEF"/><rect x="518" y="712" width="20" height="84" rx="6" fill="#357CEF"/>
  </g>
  <g id="item3" visibility="hidden">
    <rect x="430" y="890" width="140" height="140" rx="34" fill="url(#chip)"/>
    <rect x="440" y="894" width="120" height="4" rx="2" fill="#FFFFFF"/>
    <path d="M466 962 L492 988 L538 934" fill="none" stroke="#13904C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
