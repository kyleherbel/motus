<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1240" data-shadow="rest">
  <!-- Prop Room library prop: a phone seen from the front (props/STANDARD.md). Graphite frame with a chrome edge,
       a home screen of plain colour tiles (no real apps), notifications that drop in from the top.
       Parts:
         body      frame, glass edge and the island, static
         screen    wallpaper, tiles and dock; wallpaper has data-base                (recolor, pulse)
         notif1..notif3  cards under the island, start hidden, clipped to the screen
                   (show slide from up dist 160, one per beat; badge on one)
         glare     a reflection over the glass, static -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F959B"/><stop offset="0.06" stop-color="#E9ECEF"/><stop offset="0.12" stop-color="#3A3E44"/><stop offset="0.88" stop-color="#2A2D33"/><stop offset="0.94" stop-color="#C9CED4"/><stop offset="1" stop-color="#8F959B"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="1" stop-color="#000" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F3F6"/></linearGradient>
    <linearGradient id="glareG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="glass"><rect x="46" y="46" width="528" height="1148" rx="66"/></clipPath>
  </defs>

  <g id="body">
    <rect x="20" y="20" width="580" height="1200" rx="92" fill="url(#frame)"/>
    <rect x="34" y="34" width="552" height="1172" rx="80" fill="#121316"/>
    <rect x="70" y="24" width="480" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <g clip-path="url(#glass)">
    <g id="screen">
      <rect x="46" y="46" width="528" height="1148" fill="#7E9CF2" data-base=""/>
      <rect x="46" y="46" width="528" height="1148" fill="url(#wall)"/>
      <circle cx="520" cy="300" r="260" fill="#C9A7F5" opacity="0.45"/><circle cx="90" cy="980" r="300" fill="#8FD3E8" opacity="0.35"/>
      <g>
        <rect x="86" y="230" width="96" height="96" rx="26" fill="#F2B632"/><rect x="214" y="230" width="96" height="96" rx="26" fill="#34C46A"/><rect x="342" y="230" width="96" height="96" rx="26" fill="#F26B5B"/><rect x="470" y="230" width="96" height="96" rx="26" fill="#FFFFFF"/>
        <rect x="86" y="370" width="96" height="96" rx="26" fill="#357CEF"/><rect x="214" y="370" width="96" height="96" rx="26" fill="#FFFFFF"/><rect x="342" y="370" width="96" height="96" rx="26" fill="#2BB3A3"/><rect x="470" y="370" width="96" height="96" rx="26" fill="#ECAB44"/>
        <rect x="86" y="510" width="96" height="96" rx="26" fill="#9B6BE8"/><rect x="214" y="510" width="96" height="96" rx="26" fill="#F26B5B"/><rect x="342" y="510" width="96" height="96" rx="26" fill="#FFFFFF"/><rect x="470" y="510" width="96" height="96" rx="26" fill="#34C46A"/>
        <g fill="url(#tile)">
          <rect x="86" y="230" width="96" height="96" rx="26"/><rect x="214" y="230" width="96" height="96" rx="26"/><rect x="342" y="230" width="96" height="96" rx="26"/><rect x="470" y="230" width="96" height="96" rx="26"/>
          <rect x="86" y="370" width="96" height="96" rx="26"/><rect x="214" y="370" width="96" height="96" rx="26"/><rect x="342" y="370" width="96" height="96" rx="26"/><rect x="470" y="370" width="96" height="96" rx="26"/>
          <rect x="86" y="510" width="96" height="96" rx="26"/><rect x="214" y="510" width="96" height="96" rx="26"/><rect x="342" y="510" width="96" height="96" rx="26"/><rect x="470" y="510" width="96" height="96" rx="26"/>
        </g>
        <g fill="#FFFFFF" opacity="0.9">
          <circle cx="134" cy="278" r="20"/><rect x="242" y="258" width="40" height="40" rx="8"/><path d="M390 256 L414 298 H366 Z"/><circle cx="518" cy="278" r="20" fill="#F26B5B"/>
          <rect x="114" y="398" width="40" height="40" rx="20"/><rect x="238" y="402" width="48" height="32" rx="6" fill="#357CEF"/><circle cx="390" cy="418" r="22"/><rect x="498" y="398" width="40" height="40" rx="8"/>
        </g>
      </g>
      <rect x="70" y="1060" width="480" height="110" rx="40" fill="#FFFFFF" opacity="0.35"/>
      <g><rect x="96" y="1076" width="78" height="78" rx="22" fill="#34C46A"/><rect x="214" y="1076" width="78" height="78" rx="22" fill="#357CEF"/><rect x="330" y="1076" width="78" height="78" rx="22" fill="#FFFFFF"/><rect x="446" y="1076" width="78" height="78" rx="22" fill="#F2B632"/></g>
    </g>
    <g id="notif1" visibility="hidden">
      <rect x="66" y="140" width="488" height="138" rx="36" fill="url(#card)"/>
      <rect x="92" y="170" width="78" height="78" rx="20" fill="#34C46A"/><path d="M114 210 L126 222 L150 194" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="192" y="178" width="180" height="18" rx="9" fill="#2A2C31" opacity="0.85"/><rect x="192" y="212" width="320" height="14" rx="7" fill="#C9CED4"/><rect x="470" y="178" width="56" height="14" rx="7" fill="#D8DCE1"/>
    </g>
    <g id="notif2" visibility="hidden">
      <rect x="66" y="292" width="488" height="138" rx="36" fill="url(#card)"/>
      <rect x="92" y="322" width="78" height="78" rx="20" fill="#357CEF"/><rect x="112" y="346" width="38" height="30" rx="6" fill="#FFFFFF"/>
      <rect x="192" y="330" width="150" height="18" rx="9" fill="#2A2C31" opacity="0.85"/><rect x="192" y="364" width="300" height="14" rx="7" fill="#C9CED4"/><rect x="470" y="330" width="56" height="14" rx="7" fill="#D8DCE1"/>
    </g>
    <g id="notif3" visibility="hidden">
      <rect x="66" y="444" width="488" height="138" rx="36" fill="url(#card)"/>
      <rect x="92" y="474" width="78" height="78" rx="20" fill="#F2B632"/><circle cx="131" cy="513" r="20" fill="#FFFFFF"/>
      <rect x="192" y="482" width="200" height="18" rx="9" fill="#2A2C31" opacity="0.85"/><rect x="192" y="516" width="280" height="14" rx="7" fill="#C9CED4"/><rect x="470" y="482" width="56" height="14" rx="7" fill="#D8DCE1"/>
    </g>
    <rect x="236" y="70" width="148" height="44" rx="22" fill="#000000"/>
    <g id="glare"><rect x="46" y="46" width="528" height="1148" fill="url(#glareG)"/></g>
  </g>
</svg>
