<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" data-shadow="rest">
  <!-- Prop Room library prop: an envelope with a letter inside (props/STANDARD.md). The letter sits behind the
       pocket under a clip that only shows the mouth and the space above, so it emerges from inside.
       Parts:
         back      the inside of the envelope, static
         pocket    the front with its folds; data-base                       (recolor, pulse)
         flap      the top flap, data-pivot 500 20                           (move sy -1 opens it, ease inOut)
         letter    the letter, rests out of sight in the pocket; drawn last under a clip of the mouth and the
                   space above, so it rises in front of the open flap       (move dy -330 slides it out; badge) -->
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="foldL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBB497"/><stop offset="1" stop-color="#F39674"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F2F4"/></linearGradient>
    <clipPath id="mouth"><path d="M-200 -900 H1200 V20 H980 L500 300 L20 20 H-200 Z"/></clipPath>
  </defs>

  <g id="back">
    <rect x="20" y="20" width="960" height="560" rx="28" fill="#C65A40"/>
    <rect x="20" y="20" width="960" height="120" rx="28" fill="#000" opacity="0.10"/>
  </g>


  <g id="pocket">
    <path d="M20 48 C20 32 30 20 46 26 L500 300 L954 26 C970 20 980 32 980 48 V552 C980 568 968 580 952 580 H48 C32 580 20 568 20 552 Z" fill="#F2896A" data-base=""/>
    <path d="M20 48 C20 32 30 20 46 26 L500 300 L954 26 C970 20 980 32 980 48 V552 C980 568 968 580 952 580 H48 C32 580 20 568 20 552 Z" fill="url(#light)"/>
    <path d="M30 572 L500 318 L970 572" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="10" stroke-linejoin="round"/>
    <path d="M36 568 L500 322 L964 568" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 48 L500 300 L20 552 Z" fill="url(#foldL)" opacity="0.6"/>
    <path d="M60 30 L500 290" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 58 L500 330 L960 58" fill="none" stroke="#000" stroke-opacity="0.09" stroke-width="26" stroke-linejoin="round"/>
  </g>

  <g id="flap" data-pivot="500 20">
    <path d="M24 20 H976 C990 20 992 34 980 42 L520 312 C508 320 492 320 480 312 L20 42 C8 34 10 20 24 20 Z" fill="url(#flapG)"/>
    <path d="M40 26 H960" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 52 L500 306 L940 52" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="6"/>
  </g>

  <g clip-path="url(#mouth)">
    <g id="letter">
      <rect x="120" y="312" width="760" height="420" rx="14" fill="url(#paper)"/>
      <rect x="130" y="316" width="740" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="170" y="362" width="260" height="26" rx="13" fill="#357CEF"/>
      <rect x="170" y="418" width="560" height="14" rx="7" fill="#D8DADF"/>
      <rect x="170" y="450" width="500" height="14" rx="7" fill="#D8DADF"/>
      <rect x="170" y="482" width="540" height="14" rx="7" fill="#E3E5E9"/>
      <rect x="170" y="530" width="180" height="44" rx="22" fill="#13904C"/>
    </g>
  </g>
</svg>
