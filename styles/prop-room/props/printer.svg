<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" data-shadow="rest">
  <!-- Prop Room library prop: a desktop printer (props/STANDARD.md). Light plastic lit from the top.
       Parts:
         paperIn   blank stack standing in the feeder behind the top          (move, pulse)
         body      the printer, static                                         (pulse)
         led       status light inside the panel; data-base fill              (recolor, pulse)
         slot      the dark output slot                                        (pulse)
         tray      output tray at the foot                                     (static)
         sheet     printed page, rests inside; clipped below the slot          (move dy 300 slides it out; badge)
         sheet2    a second page under the same clip                           (move dy 300; swap with sheet) -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8EAED"/><stop offset="1" stop-color="#C9CED4"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFAFB"/><stop offset="1" stop-color="#E1E4E8"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#363A40"/><stop offset="1" stop-color="#1C1E22"/></linearGradient>
    <linearGradient id="slotIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121316"/><stop offset="1" stop-color="#2E3237"/></linearGradient>
    <linearGradient id="trayG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E7EB"/><stop offset="1" stop-color="#BFC4CB"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F1F4"/></linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="lipShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9B0B7"/><stop offset="1" stop-color="#C3C8CE"/></linearGradient>
    <radialGradient id="ledGlow"><stop offset="0.35" stop-color="#4BDD7F" stop-opacity="0.55"/><stop offset="1" stop-color="#4BDD7F" stop-opacity="0"/></radialGradient>
    <clipPath id="bodyClip"><rect x="20" y="190" width="960" height="470" rx="60"/></clipPath>
    <clipPath id="out"><rect x="0" y="458" width="1000" height="400"/></clipPath>
  </defs>

  <g id="paperIn">
    <rect x="300" y="30" width="400" height="220" rx="8" fill="url(#paper)"/>
    <rect x="300" y="30" width="400" height="220" rx="8" fill="#000" fill-opacity="0.03"/>
    <rect x="330" y="0" width="340" height="40" rx="6" fill="#F4F5F7" transform="translate(0 12)"/>
    <rect x="300" y="200" width="400" height="50" fill="url(#lipShade)" opacity="0.6"/>
  </g>

  <g id="body">
    <rect x="20" y="190" width="960" height="470" rx="60" fill="url(#face)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="20" y="190" width="960" height="96" fill="url(#lid)"/>
      <rect x="20" y="286" width="960" height="5" fill="#B9BEC5"/>
      <rect x="20" y="291" width="960" height="26" fill="url(#lipShade)" opacity="0.5"/>
      <rect x="20" y="560" width="960" height="100" fill="url(#foot)"/>
    </g>
    <rect x="68" y="196" width="864" height="5" rx="2.5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="26" y="230" width="4" height="380" rx="2" fill="#FFFFFF" opacity="0.35"/>
    <!-- control panel -->
    <rect x="742" y="330" width="196" height="78" rx="22" fill="url(#dark)"/>
    <rect x="742" y="330" width="196" height="78" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="856" cy="369" r="13" fill="#5A6469"/>
    <circle cx="898" cy="369" r="13" fill="#5A6469"/>
    <rect x="746" y="404" width="188" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <!-- slot surround and the strip near the foot -->
    <rect x="110" y="418" width="780" height="56" rx="28" fill="#000" fill-opacity="0.05"/>
    <rect x="80" y="596" width="400" height="20" rx="10" fill="url(#strip)"/>
    <rect x="80" y="614" width="400" height="3" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <g id="led" data-ring="#4BDD7F">
    <circle cx="814" cy="369" r="40" fill="url(#ledGlow)"/>
    <circle cx="814" cy="369" r="14" fill="#4BDD7F" data-base=""/>
    <circle cx="810" cy="364" r="5" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <g id="slot">
    <rect x="130" y="428" width="740" height="34" rx="17" fill="url(#slotIn)"/>
    <rect x="146" y="462" width="708" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <g id="tray">
    <rect x="170" y="640" width="660" height="70" rx="26" fill="url(#trayG)"/>
    <rect x="196" y="645" width="608" height="4" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <rect x="170" y="640" width="660" height="22" fill="url(#lipShade)" opacity="0.7"/>
  </g>

  <g clip-path="url(#out)">
    <g id="sheet">
      <rect x="250" y="160" width="500" height="300" rx="8" fill="url(#paper)"/>
      <rect x="292" y="202" width="190" height="22" rx="11" fill="#357CEF"/>
      <rect x="292" y="248" width="400" height="12" rx="6" fill="#D8DADF"/>
      <rect x="292" y="276" width="350" height="12" rx="6" fill="#D8DADF"/>
      <rect x="292" y="304" width="380" height="12" rx="6" fill="#E3E5E9"/>
      <rect x="292" y="332" width="260" height="12" rx="6" fill="#E3E5E9"/>
      <rect x="292" y="376" width="150" height="38" rx="19" fill="#13904C"/>
    </g>
    <g id="sheet2">
      <rect x="250" y="160" width="500" height="300" rx="8" fill="url(#paper)"/>
      <rect x="292" y="202" width="230" height="22" rx="11" fill="#ECAB44"/>
      <rect x="292" y="248" width="400" height="12" rx="6" fill="#D8DADF"/>
      <rect x="292" y="276" width="310" height="12" rx="6" fill="#D8DADF"/>
      <rect x="292" y="304" width="380" height="12" rx="6" fill="#E3E5E9"/>
      <rect x="292" y="332" width="220" height="12" rx="6" fill="#E3E5E9"/>
    </g>
    <!-- the slot lip shades the page right where it comes out -->
    <rect x="130" y="458" width="740" height="30" fill="url(#lipShade)"/>
  </g>
</svg>
