<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" data-shadow="float">
  <!-- Prop Room library prop: a cassette tape (props/STANDARD.md). Dark plastic shell lit from the top, a paper
       label, a smoked window with two reels; it floats, so it casts the floating shadow [C19].
       Parts:
         shell     the case, screws and the lower ridge, static
         label     the paper label with its colour stripes; stripes carry data-base     (recolor, pulse)
         reelL     left reel: hub, teeth and its wound tape                             (spin; spin stop)
         reelR     right reel                                                            (spin; spin stop)
         window    smoked window glass over the reels, static -->
  <defs>
    <linearGradient id="shellG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3E44"/><stop offset="1" stop-color="#1A1C20"/></linearGradient>
    <linearGradient id="ridgeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2F34"/><stop offset="1" stop-color="#16181B"/></linearGradient>
    <linearGradient id="labelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#ECE6DA"/></linearGradient>
    <linearGradient id="winG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4F57"/><stop offset="1" stop-color="#25282D"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/></linearGradient>
    <radialGradient id="tapeG" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#3B2A22"/><stop offset="0.97" stop-color="#5A4134"/><stop offset="1" stop-color="#2A1D17"/></radialGradient>
    <linearGradient id="hubG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DCE1"/></linearGradient>
    <linearGradient id="screwG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8FA"/><stop offset="1" stop-color="#8F959B"/></linearGradient>
    <clipPath id="winClip"><rect x="250" y="270" width="500" height="150" rx="75"/></clipPath>
  </defs>

  <g id="shell">
    <rect x="20" y="20" width="960" height="600" rx="54" fill="url(#shellG)"/>
    <rect x="62" y="24" width="876" height="5" rx="2.5" fill="#FFFFFF" opacity="0.28"/>
    <rect x="24" y="80" width="4" height="460" rx="2" fill="#FFFFFF" opacity="0.10"/>
    <path d="M210 620 L262 488 L738 488 L790 620 Z" fill="url(#ridgeG)"/>
    <path d="M262 488 L738 488" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
    <circle cx="345" cy="560" r="18" fill="#0E0F11"/><circle cx="655" cy="560" r="18" fill="#0E0F11"/>
    <rect x="455" y="540" width="90" height="40" rx="10" fill="#0E0F11"/>
    <g fill="url(#screwG)">
      <circle cx="74" cy="74" r="16"/><circle cx="926" cy="74" r="16"/><circle cx="74" cy="566" r="16"/><circle cx="926" cy="566" r="16"/><circle cx="500" cy="590" r="12"/>
    </g>
    <g stroke="#4D525A" stroke-width="4" stroke-linecap="round">
      <path d="M64 74 L84 74"/><path d="M916 74 L936 74"/><path d="M64 566 L84 566"/><path d="M916 566 L936 566"/>
    </g>
  </g>

  <g id="label">
    <rect x="92" y="78" width="816" height="380" rx="26" fill="url(#labelG)"/>
    <rect x="104" y="82" width="792" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="92" y="150" width="816" height="26" fill="#E38056" data-base=""/>
    <rect x="92" y="182" width="816" height="14" fill="#ECAB44"/>
    <rect x="132" y="104" width="280" height="22" rx="11" fill="#2A2C31" opacity="0.85"/>
    <rect x="770" y="104" width="96" height="22" rx="11" fill="#C9C3B6"/>
    <rect x="150" y="402" width="200" height="12" rx="6" fill="#C9C3B6"/>
    <rect x="650" y="402" width="200" height="12" rx="6" fill="#C9C3B6"/>
  </g>

  <g id="window">
    <rect x="236" y="256" width="528" height="178" rx="89" fill="#1A1C20"/>
    <rect x="250" y="270" width="500" height="150" rx="75" fill="url(#winG)"/>
  </g>

  <g clip-path="url(#winClip)">
    <rect x="420" y="300" width="160" height="96" fill="#3B2A22"/>
    <g id="reelL">
      <circle cx="350" cy="345" r="96" fill="url(#tapeG)"/>
      <circle cx="350" cy="345" r="44" fill="url(#hubG)"/>
      <circle cx="350" cy="345" r="20" fill="#2A2C31"/>
      <g fill="#FFFFFF">
        <rect x="344" y="315" width="12" height="16" rx="3"/><rect x="344" y="359" width="12" height="16" rx="3"/>
        <rect x="320" y="339" width="16" height="12" rx="3"/><rect x="364" y="339" width="16" height="12" rx="3"/>
      </g>
      <circle cx="350" cy="306" r="5" fill="#9AA0A7"/>
    </g>
    <g id="reelR">
      <circle cx="650" cy="345" r="62" fill="url(#tapeG)"/>
      <circle cx="650" cy="345" r="44" fill="url(#hubG)"/>
      <circle cx="650" cy="345" r="20" fill="#2A2C31"/>
      <g fill="#FFFFFF">
        <rect x="644" y="315" width="12" height="16" rx="3"/><rect x="644" y="359" width="12" height="16" rx="3"/>
        <rect x="620" y="339" width="16" height="12" rx="3"/><rect x="664" y="339" width="16" height="12" rx="3"/>
      </g>
      <circle cx="650" cy="306" r="5" fill="#9AA0A7"/>
    </g>
    <rect x="250" y="270" width="500" height="150" fill="url(#glassG)"/>
    <path d="M300 286 L700 286" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
